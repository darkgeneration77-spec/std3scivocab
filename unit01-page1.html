<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第一单元：科学技能｜核心词汇</title><style>:root{--bg:#f6f8fb;--text:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1180px;margin:auto;padding:26px 16px 56px}.top,.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.btn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:#344054;font-weight:800}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;margin-bottom:20px}.k{color:var(--blue);font-weight:900}.sub{color:var(--muted);line-height:1.7}.progress{margin-top:14px}.track{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue)}.pt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}.group{margin:24px 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.card.done{outline:2px solid #bbf7d0}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:22px;font-weight:900}.py{color:var(--muted);font-size:13px;margin-top:3px}.level{font-size:11px;font-weight:900;background:#eaf2ff;color:#1d4ed8;padding:5px 8px;border-radius:99px;height:max-content}.level.b{background:#f2f4f7;color:#475467}.desc{line-height:1.6;margin:10px 0;color:#344054}.check{display:flex;gap:8px;align-items:center;border-top:1px solid #eee;padding-top:9px;font-weight:800}.check input{width:18px;height:18px}.note{background:#eff6ff;color:#1e40af;border-radius:16px;padding:16px;margin-top:20px;line-height:1.7;font-weight:800}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><a class="btn" href="index.html">← 首页</a><a class="btn" href="unit01-page2.html">Page 2 →</a></div><section class="hero"><div class="k">第一单元 · 科学技能 · Page 1 / 4</div><h1>完整科学词汇</h1><p class="sub">按课本科学程序技能、资料表达和科学操作技能补齐。</p><div class="progress"><div class="pt"><span>学习进度</span><strong id="count"></strong></div><div class="track"><div class="bar" id="bar"></div></div></div></section><div id="content"></div><div class="note">六项核心科学程序技能：观察、分类、测量与应用数字、推断、预测、沟通；同时掌握课本常见的资料、记录、比较、工具、数值和操作词。</div></main><script>const groups=[['科学程序技能',[['观察','guān chá','利用感官收集资料。','A'],['感官','gǎn guān','眼、耳、鼻、舌和皮肤等帮助观察的身体部分。','B'],['资料','zī liào','通过观察、测量或活动得到的信息。','B'],['记录','jì lù','把观察或测量结果写下、画下或整理保存。','B'],['分类','fēn lèi','根据共同特征和不同特征把事物分组。','A'],['特征','tè zhēng','事物可以被观察和比较的特点。','B'],['相同点','xiāng tóng diǎn','两个或多个事物一样的地方。','B'],['不同点','bù tóng diǎn','两个或多个事物不一样的地方。','B'],['比较','bǐ jiào','找出相同点和不同点。','B'],['测量与应用数字','cè liáng yǔ yìng yòng shù zì','使用适当工具、单位和数字取得资料。','A'],['测量工具','cè liáng gōng jù','用来取得长度、体积等测量结果的工具。','B'],['数值','shù zhí','测量后得到的数字。','B'],['标准单位','biāo zhǔn dān wèi','大家共同使用的测量单位。','B'],['推断','tuī duàn','根据观察到的资料说明合理原因。','A'],['原因','yuán yīn','用来解释观察结果为什么会发生。','B'],['预测','yù cè','根据已有资料推测接下来可能发生的情况。','A'],['沟通','gōu tōng','把科学资料清楚地表达出来。','A'],['口头表达','kǒu tóu biǎo dá','用说话方式传达科学资料。','B'],['表格','biǎo gé','整理和呈现资料的一种方式。','B']]],['科学操作技能',[['科学器材','kē xué qì cái','科学活动中使用的工具。','A'],['科学材料','kē xué cái liào','科学活动中使用或观察的材料。','A'],['标本','biāo běn','供观察或研究的生物或物体样本。','A'],['正确操作','zhèng què cāo zuò','按正确方法安全使用器材、材料和标本。','A'],['绘画','huì huà','准确画出标本、器材或材料的形状和特征。','A'],['清洗','qīng xǐ','使用后正确清洁科学器材。','A'],['储存','chǔ cún','把器材和材料安全放回正确位置。','A']]]];const flat=groups.flatMap(g=>g[1]);content.innerHTML=groups.map(([name,arr])=>`<h2 class="group">${name}</h2><section class="grid">${arr.map((x,i)=>{let n=flat.indexOf(x);return `<article class="card" data-i="${n}"><div class="head"><div><div class="word">${x[0]}</div><div class="py">${x[1]}</div></div><span class="level ${x[3]==='B'?'b':''}">${x[3]==='A'?'★ 必须掌握':'● 需要认识'}</span></div><div class="desc">${x[2]}</div><label class="check"><input type="checkbox">我学会了</label></article>`}).join('')}</section>`).join('');const KEY='std3-sci-unit01-page1-v3',saved=JSON.parse(localStorage.getItem(KEY)||'{}'),cards=[...document.querySelectorAll('.card')];cards.forEach(c=>{let box=c.querySelector('input'),k=c.dataset.i;box.checked=!!saved[k];box.onchange=update});function update(){let s={},n=0;cards.forEach(c=>{let b=c.querySelector('input');s[c.dataset.i]=b.checked;if(b.checked)n++;c.classList.toggle('done',b.checked)});localStorage.setItem(KEY,JSON.stringify(s));count.textContent=`${n} / ${cards.length}`;bar.style.width=`${n/cards.length*100}%`}update();</script></body></html>
