<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第一单元：科学技能｜认识词汇</title><link rel="stylesheet" href="theme.css"><style>.heroVisual{background:#fff;border:1px solid #e5e7eb;border-radius:26px;padding:12px;box-shadow:0 14px 34px rgba(23,32,51,.07);margin:18px 0 22px}.heroVisual img{display:block;width:100%;border-radius:20px}.progressBox{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:18px 20px;margin-bottom:22px}.pt{display:flex;justify-content:space-between;gap:12px;font-size:16px;color:#667085;margin-bottom:8px}.track{height:12px;background:#e8edf4;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#2563eb;transition:.25s}.group{margin:28px 0 12px;font-size:27px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:2px solid #e7eaf0;border-radius:20px;padding:18px;transition:.2s}.card.done{border-color:#86efac;background:#f0fdf4}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:25px;font-weight:950}.py{color:#667085;font-size:15px;margin-top:4px}.level{font-size:12px;font-weight:900;background:#eaf2ff;color:#1d4ed8;padding:6px 9px;border-radius:99px;height:max-content;white-space:nowrap}.level.b{background:#f2f4f7;color:#475467}.desc{font-size:18px;line-height:1.7;margin:12px 0;color:#344054}.check{display:flex;gap:9px;align-items:center;border-top:1px solid #eee;padding-top:11px;font-weight:900;font-size:17px}.check input{width:20px;height:20px}.note{background:#eff6ff;color:#1e40af;border-radius:18px;padding:18px 20px;margin-top:24px;line-height:1.8;font-weight:850;font-size:18px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}.group{font-size:24px}.word{font-size:23px}.desc{font-size:17px}.heroVisual{padding:8px}}</style></head><body><main class="w"><div class="nav"><a class="btn" href="index.html">← 首页</a><div class="tabs"><a class="tab on" href="unit01-page1.html">认识词汇</a><a class="tab" href="unit01-page2.html">看图理解</a><a class="tab" href="unit01-page3.html">学会答题</a><a class="tab" href="unit01-page4.html">挑战测试</a></div></div><section class="hero"><div class="k">UNIT 01 · 科学技能 · 第 1 站</div><h1>先认识科学词汇</h1><div class="sub">先看主图建立整体印象，再逐个掌握科学程序技能和科学操作技能。</div></section><section class="heroVisual"><img src="unit01-page1-main.png" alt="科学技能主视觉图"></section><section class="progressBox"><div class="pt"><span>学习进度</span><strong id="count"></strong></div><div class="track"><div class="bar" id="bar"></div></div></section><div id="content"></div><div class="note">六项核心科学程序技能：观察、分类、测量与应用数字、推断、预测、沟通；同时掌握课本常见的资料、记录、比较、工具、数值和操作词。</div><div class="foot"><a class="btn" href="index.html">← 首页</a><a class="btn primary" href="unit01-page2.html">看图理解 →</a></div></main><script>const groups=[['科学程序技能',[['观察','guān chá','利用感官收集资料。','A'],['感官','gǎn guān','眼、耳、鼻、舌和皮肤等帮助观察的身体部分。','B'],['资料','zī liào','通过观察、测量或活动得到的信息。','B'],['记录','jì lù','把观察或测量结果写下、画下或整理保存。','B'],['分类','fēn lèi','根据共同特征和不同特征把事物分组。','A'],['特征','tè zhēng','事物可以被观察和比较的特点。','B'],['相同点','xiāng tóng diǎn','两个或多个事物一样的地方。','B'],['不同点','bù tóng diǎn','两个或多个事物不一样的地方。','B'],['比较','bǐ jiào','找出相同点和不同点。','B'],['测量与应用数字','cè liáng yǔ yìng yòng shù zì','使用适当工具、单位和数字取得资料。','A'],['测量工具','cè liáng gōng jù','用来取得长度、体积等测量结果的工具。','B'],['数值','shù zhí','测量后得到的数字。','B'],['标准单位','biāo zhǔn dān wèi','大家共同使用的测量单位。','B'],['推断','tuī duàn','根据观察到的资料说明合理原因。','A'],['原因','yuán yīn','用来解释观察结果为什么会发生。','B'],['预测','yù cè','根据已有资料推测接下来可能发生的情况。','A'],['沟通','gōu tōng','把科学资料清楚地表达出来。','A'],['口头表达','kǒu tóu biǎo dá','用说话方式传达科学资料。','B'],['表格','biǎo gé','整理和呈现资料的一种方式。','B']]],['科学操作技能',[['科学器材','kē xué qì cái','科学活动中使用的工具。','A'],['科学材料','kē xué cái liào','科学活动中使用或观察的材料。','A'],['标本','biāo běn','供观察或研究的生物或物体样本。','A'],['正确操作','zhèng què cāo zuò','按正确方法安全使用器材、材料和标本。','A'],['绘画','huì huà','准确画出标本、器材或材料的形状和特征。','A'],['清洗','qīng xǐ','使用后正确清洁科学器材。','A'],['储存','chǔ cún','把器材和材料安全放回正确位置。','A']]]];const flat=groups.flatMap(g=>g[1]);content.innerHTML=groups.map(([name,arr])=>`<h2 class="group">${name}</h2><section class="grid">${arr.map(x=>{let n=flat.indexOf(x);return `<article class="card" data-i="${n}"><div class="head"><div><div class="word">${x[0]}</div><div class="py">${x[1]}</div></div><span class="level ${x[3]==='B'?'b':''}">${x[3]==='A'?'★ 必须掌握':'● 需要认识'}</span></div><div class="desc">${x[2]}</div><label class="check"><input type="checkbox">我学会了</label></article>`}).join('')}</section>`).join('');const KEY='std3-sci-unit01-page1-v3',saved=JSON.parse(localStorage.getItem(KEY)||'{}'),cards=[...document.querySelectorAll('.card')];cards.forEach(c=>{let box=c.querySelector('input'),k=c.dataset.i;box.checked=!!saved[k];box.onchange=update});function update(){let s={},n=0;cards.forEach(c=>{let b=c.querySelector('input');s[c.dataset.i]=b.checked;if(b.checked)n++;c.classList.toggle('done',b.checked)});localStorage.setItem(KEY,JSON.stringify(s));count.textContent=`${n} / ${cards.length}`;bar.style.width=`${n/cards.length*100}%`}update();</script></body></html>
