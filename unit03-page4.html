<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第三单元：人类｜快速复习</title><style>:root{--bg:#f7f8fc;--text:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--shadow:0 14px 36px rgba(23,32,51,.08)}*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1000px;margin:auto;padding:28px 18px 56px}.top,.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}.btn{border:1px solid var(--line);background:#fff;color:#344054;padding:10px 14px;border-radius:12px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--blue);color:#fff}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-bottom:22px}.kicker{color:var(--blue);font-weight:900}h1{font-size:clamp(28px,4vw,44px);margin:8px 0}.sub{color:var(--muted);line-height:1.7}.q{padding:17px 0;border-top:1px solid #eef1f5}.q:first-child{border-top:0}.qt{font-weight:900;line-height:1.6;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:left;font-weight:800;cursor:pointer}.choice.correct{background:#dcfce7}.choice.wrong{background:#fee2e2}.feedback{font-size:14px;font-weight:800;margin-top:8px;min-height:20px}.result{font-size:26px;font-weight:900}.wrong{background:#fff7ed;border-radius:12px;padding:11px;margin-top:10px;line-height:1.6}@media(max-width:600px){main{padding:18px 12px}.choices{grid-template-columns:1fr}.hero,.panel{border-radius:18px}}</style></head><body><main><div class="top"><div><a class="btn" href="index.html">← 首页</a> <a class="btn" href="unit03-page3.html">← Page 3</a></div><button class="btn primary" onclick="checkAll()">检查全部</button></div><section class="hero"><div class="kicker">第三单元 · 人类 · Page 4 / 4</div><h1>快速复习</h1><p class="sub">14题覆盖牙齿种类与结构、牙齿护理、七类食物、均衡饮食和消化。</p></section><section class="panel" id="quiz"></section><section class="panel"><div class="result" id="score">得分：0 / 14</div><div id="status" class="sub">完成后按「检查全部」。</div><div id="wrongs"></div><p><button class="btn" onclick="resetQuiz()">重新作答</button></p></section><div class="footer"><a class="btn" href="unit03-page3.html">← Page 3</a><a class="btn primary" href="index.html">返回首页</a></div></main><script>const KEY='std3-sci-unit03-page4-v2',data=[['哪一种牙齿主要用来切断食物？','门牙',['门牙','犬齿'],'门牙主要用来切断食物。'],['哪一种牙齿主要用来撕裂食物？','犬齿',['犬齿','臼齿'],'犬齿较尖，主要用来撕裂食物。'],['哪一种牙齿主要用来磨碎食物？','臼齿',['门牙','臼齿'],'臼齿主要用来磨碎食物。'],['牙齿最外层的坚硬部分是什么？','牙釉质',['牙釉质','牙龈'],'牙釉质位于牙齿最外层。'],['哪一个结构帮助牙齿感受刺激？','神经',['神经','牙本质'],'神经帮助感受刺激。'],['哪一种牙齿会逐渐脱落并由恒牙替代？','乳牙',['乳牙','恒牙'],'乳牙会逐渐脱落。'],['哪一种做法有助于牙齿护理？','使用牙线',['少刷牙','使用牙线'],'刷牙、牙线和牙科检查都有助于牙齿护理。'],['哪一类食物主要提供能量？','碳水化合物',['碳水化合物','蛋白质'],'碳水化合物主要提供能量。'],['哪一类食物帮助身体生长与修复？','蛋白质',['蛋白质','维生素'],'蛋白质帮助身体生长与修复。'],['哪一类食物帮助排便并预防便秘？','膳食纤维',['脂肪','膳食纤维'],'膳食纤维帮助排便。'],['均衡饮食最重要的特点是什么？','适量摄取不同类别食物',['只吃喜欢的食物','适量摄取不同类别食物'],'均衡饮食强调不同类别和适量。'],['消化的主要作用是什么？','把食物分解成更小部分',['让食物变甜','把食物分解成更小部分'],'消化使营养更容易被吸收。'],['食物离开口腔后先经过哪里？','食道',['食道','胃'],'正确路线是口腔→食道→胃。'],['哪一个消化路线正确？','口腔→食道→胃→肠→肛门',['口腔→胃→食道→肠→肛门','口腔→食道→胃→肠→肛门'],'正确路线必须按器官顺序。']];quiz.innerHTML=data.map((x,i)=>`<div class="q" data-a="${x[1]}" data-e="${x[3]}"><div class="qt">${i+1}. ${x[0]}</div><div class="choices">${x[2].map(c=>`<button class="choice">${c}</button>`).join('')}</div><div class="feedback"></div></div>`).join('');const qs=[...document.querySelectorAll('.q')];qs.forEach(q=>q.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{q.querySelectorAll('.choice').forEach(x=>{x.dataset.sel='';x.style.outline=''});b.dataset.sel='1';b.style.outline='2px solid #93c5fd'}));function checkAll(){let s=0,a=0,w=[];qs.forEach((q,i)=>{let sel=[...q.querySelectorAll('.choice')].find(b=>b.dataset.sel==='1');q.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','wrong'));let f=q.querySelector('.feedback');if(!sel){f.textContent='尚未作答。';w.push(`第 ${i+1} 题未作答。${q.dataset.e}`);return}a++;let ok=sel.textContent===q.dataset.a;q.querySelectorAll('.choice').forEach(b=>{if(b.textContent===q.dataset.a)b.classList.add('correct')});if(ok){s++;f.textContent='正确。'}else{sel.classList.add('wrong');f.textContent=`错误。正确答案：${q.dataset.a}。${q.dataset.e}`;w.push(`第 ${i+1} 题：${q.dataset.e}`)}});score.textContent=`得分：${s} / 14`;status.textContent=a<14?`已完成 ${a}/14 题。`:s>=12?'掌握良好，本单元已完成。':s>=10?'基本掌握，请订正错题。':'建议回到 Page 2–3 复习。';wrongs.innerHTML=w.map(x=>`<div class="wrong">${x}</div>`).join('');localStorage.setItem(KEY,JSON.stringify({score:s,answered:a,completed:a===14&&s>=12}))}function resetQuiz(){qs.forEach(q=>{q.querySelectorAll('.choice').forEach(b=>{b.dataset.sel='';b.classList.remove('correct','wrong');b.style.outline=''});q.querySelector('.feedback').textContent=''});score.textContent='得分：0 / 14';status.textContent='完成后按「检查全部」。';wrongs.innerHTML='';localStorage.removeItem(KEY)}try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isFinite(old.score)){score.textContent=`上次得分：${old.score} / 14`;status.textContent=old.completed?'本单元之前已完成。':'上次未达到完成标准，可重新作答。'}}catch(e){}</script></body></html>
