<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学探索站</title><link rel="stylesheet" href="theme.css"><style>*{box-sizing:border-box}.w{max-width:1120px;margin:auto;padding:24px 16px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#344054;font-weight:900;background:#fff;border:2px solid #e5e9ee;border-radius:14px;padding:11px 15px}.journey{display:flex;gap:8px;flex-wrap:wrap}.step{display:flex;align-items:center;gap:7px;text-decoration:none;color:#657083;background:#fff;border:2px solid #e5e9ee;border-radius:999px;padding:9px 13px;font-weight:900}.step span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#f2f4f7;font-size:.8rem}.step.on{background:#172033;color:#fff;border-color:#172033}.step.on span{background:#76df9f;color:#173926}.hero{background:#dff5e9!important;padding:30px!important;margin-bottom:20px!important;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:28px;top:12px;font-size:78px;color:#b7e7cb}.k{color:#39805b!important;font-weight:950!important}.sub{max-width:760px;color:#4e675a!important}.legend{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.contentTitle{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 15px}.contentTitle strong{font-size:1.15rem}.grid{grid-template-columns:repeat(2,1fr)!important}.card{padding:20px!important;background:#fff!important;transition:.16s}.card:hover{transform:translateY(-2px)}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.desc{color:#465166!important}.check{display:flex!important;gap:9px;align-items:center}.panel{background:#fff!important;padding:24px!important}.box{background:#f8fafc!important;border:2px solid #edf0f3;border-radius:18px!important;padding:18px!important}.qa{border-top:2px solid #f0f2f4!important}.ans{background:#eef9f2;padding:10px 12px;border-radius:12px;color:#28724a!important}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.choice{text-align:left!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:2px solid #e5e9ee;background:#fff;color:#344054;padding:10px 15px;border-radius:13px;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#172033;color:#fff;border-color:#172033}.saved{margin-top:12px;padding:13px 15px;border-radius:14px;background:#ecfdf3;color:#166534;font-weight:850;display:none}.saved.show{display:block}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}.routeNote{font-size:.9rem;color:#687386;font-weight:800}@media(max-width:760px){.topbar{align-items:flex-start;flex-direction:column}.journey{width:100%}.step{flex:1;justify-content:center;padding:8px}.step b{display:none}.grid,.choices{grid-template-columns:1fr!important}.hero{padding:22px!important}.hero:after{font-size:52px}.contentTitle{align-items:flex-start;flex-direction:column}}</style></head><body><main class="w"><div class="topbar"><a class="home" href="index.html">← 探索地图</a><nav class="journey" id="tabs"></nav></div><section class="hero"><div class="k" id="k"></div><h1 id="title"></h1><div class="sub" id="sub"></div><div class="legend" id="legend"></div></section><div class="contentTitle"><strong id="stageTitle"></strong><span class="routeNote">认识词汇 → 看图理解 → 学会答题 → 挑战测试</span></div><div id="content"></div><div class="foot" id="foot"></div></main><script src="units-data.js"></script><script>const q=new URLSearchParams(location.search),u=Number(q.get('u')||4),rawP=Number(q.get('p')||1),p=Number.isFinite(rawP)?Math.min(4,Math.max(1,rawP)):1,d=UNITS[u];if(!d){location.replace('index.html');throw new Error('Invalid unit')}const names=['认识词汇','看图理解','学会答题','挑战测试'],levelClass={must:'A',know:'B',support:'C'},levelText={must:'★ 必须掌握',know:'● 需要认识',support:'○ 辅助理解'},getLevel=x=>x[3]||'know';document.title=`三年级科学｜Unit ${u} ${d.title}｜${names[p-1]}`;k.textContent=`UNIT ${String(u).padStart(2,'0')} · ${d.title}`;title.textContent=names[p-1];stageTitle.textContent=`第 ${p} 站 · ${names[p-1]}`;sub.textContent=p===1?`先掌握「${d.topic}」真正会用到的词。大字、拼音、简单解释，一次看清。`:p===2?'把生字和科学概念连起来。先看关系，再记答案。':p===3?'练习考试常见问法，看到关键词就知道应该写什么。':'完成挑战后立即批改；达到 75% 或以上，就点亮这个单元。';legend.innerHTML=p===1?'<span class="badge lvA">★ 必须掌握</span><span class="badge lvB">● 需要认识</span><span class="badge lvC">○ 辅助理解</span>':'';tabs.innerHTML=[1,2,3,4].map(x=>`<a class="step ${x===p?'on':''}" href="unit.html?u=${u}&p=${x}"><span>${x}</span><b>${names[x-1]}</b></a>`).join('');const C=document.getElementById('content');if(p===1){C.innerHTML=`<section class="grid">${d.v.map((x,i)=>{const lv=getLevel(x),cl=levelClass[lv]||'B';return `<article class="card"><div class="head"><div><div class="word">${x[0]}</div><div class="py">${x[1]}</div></div><span class="badge lv${cl}">${levelText[lv]||levelText.know}</span></div><div class="desc">${x[2]}</div><label class="check"><input type="checkbox" data-i="${i}"> 我学会了</label></article>`}).join('')}</section>`;const key=`std3-u${u}-p1`;let s={};try{s=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}document.querySelectorAll('input').forEach(x=>{x.checked=!!s[x.dataset.i];x.onchange=()=>{s[x.dataset.i]=x.checked;localStorage.setItem(key,JSON.stringify(s))}})}else if(p===2){C.innerHTML=`<section class="panel"><div class="big">${d.topic}</div>${d.p2.map((x,i)=>`<div class="box"><b>${i+1}.</b> ${x}</div>`).join('')}</section>`}else if(p===3){C.innerHTML=`<section class="panel">${d.p3.map((x,i)=>`<div class="qa"><div class="big">${i+1}. ${x[0]}</div><div class="ans">答题方向：${x[1]}</div></div>`).join('')}</section>`}else{function sampleEvenly(arr,n=10){if(arr.length<=n)return arr;return Array.from({length:n},(_,i)=>arr[Math.round(i*(arr.length-1)/(n-1))])}let must=d.v.filter(x=>getLevel(x)==='must'),pool=sampleEvenly(must,must.length>=8?10:8);if(pool.length<8){const extra=d.v.filter(x=>getLevel(x)!=='must'&&!pool.includes(x));pool=pool.concat(extra.slice(0,8-pool.length))}const qs=pool.map((x,i)=>{const candidates=d.v.filter(y=>y[0]!==x[0]),wrong=candidates[(i*3+u)%candidates.length][0];return{q:`哪一个词最符合这个解释：${x[2]}`,a:x[0],b:wrong}}),key=`std3-u${u}-p4`;C.innerHTML=`<section class="panel"><div class="big">${qs.length} 题挑战</div><div class="sub">全部作答后再批改。达到 75% 或以上即可完成本单元。</div><div id="quiz">${qs.map((z,i)=>`<div class="qa" data-a="${z.a}"><b>${i+1}. ${z.q}</b><div class="choices"><button class="choice">${z.a}</button><button class="choice">${z.b}</button></div><div class="feedback"></div></div>`).join('')}</div><div class="actions"><button class="btn primary" id="mark">批改答案</button><button class="btn" id="reset">重新作答</button></div><div class="score" id="score"></div><div class="saved" id="saved"></div></section>`;const rows=[...document.querySelectorAll('.qa')];rows.forEach(e=>e.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{e.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');e.dataset.pick=b.textContent}));function readSaved(){const raw=localStorage.getItem(key);if(!raw)return null;if(raw==='complete')return{completed:true};try{return JSON.parse(raw)}catch(e){return null}}const old=readSaved();if(old?.completed){saved.textContent=Number.isFinite(old.score)?`上次得分：${old.score} / ${old.total}，本单元已完成。`:'本单元之前已完成。';saved.classList.add('show')}mark.onclick=()=>{let n=0,all=true;rows.forEach(e=>{e.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','wrong'));const f=e.querySelector('.feedback');if(!e.dataset.pick){all=false;f.textContent='尚未作答';return}const ok=e.dataset.pick===e.dataset.a;if(ok)n++;e.querySelectorAll('.choice').forEach(b=>{if(b.textContent===e.dataset.a)b.classList.add('correct');else if(b.textContent===e.dataset.pick)b.classList.add('wrong')});f.textContent=ok?'正确':'错误。正确答案：'+e.dataset.a});score.textContent=all?`${n} / ${qs.length}`:`${n} / ${qs.length}（还有题目未作答）`;if(all){const completed=n/qs.length>=.75;localStorage.setItem(key,JSON.stringify({score:n,total:qs.length,completed}));saved.textContent=completed?'挑战完成，本单元已经点亮。':'还差一点，请订正后重新挑战。';saved.classList.add('show')}};reset.onclick=()=>{rows.forEach(e=>{delete e.dataset.pick;e.querySelectorAll('.choice').forEach(b=>b.classList.remove('sel','correct','wrong'));e.querySelector('.feedback').textContent=''});score.textContent='';saved.classList.remove('show');saved.textContent='';localStorage.removeItem(key)}}foot.innerHTML=`${p>1?`<a class="btn" href="unit.html?u=${u}&p=${p-1}">← ${names[p-2]}</a>`:'<a class="btn" href="index.html">← 探索地图</a>'}${p<4?`<a class="btn primary" href="unit.html?u=${u}&p=${p+1}">${names[p]} →</a>`:'<a class="btn primary" href="index.html">完成 · 返回探索地图</a>'}`;</script></body></html>
