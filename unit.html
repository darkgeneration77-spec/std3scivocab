<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学</title><style>:root{--b:#2563eb;--g:#15803d;--r:#b42318;--bg:#f6f8fb;--line:#e5e7eb;--muted:#667085}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#f9fbff,#f6f8fb);color:#172033}.w{max-width:1080px;margin:auto;padding:24px 16px 50px}.nav,.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn,.tab{border:1px solid var(--line);background:#fff;color:#344054;text-decoration:none;padding:9px 13px;border-radius:11px;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab.on{background:var(--b);color:#fff}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 30px #17203312;margin-bottom:18px}.k{color:var(--b);font-size:13px;font-weight:900}h1{font-size:clamp(28px,4vw,42px);margin:7px 0}.sub{color:var(--muted);line-height:1.7}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px}.lvA{background:#eaf2ff;color:#1d4ed8}.lvB{background:#f2f4f7;color:#475467}.lvC{background:#fff7ed;color:#9a3412}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.word{font-size:23px;font-weight:900}.py{color:var(--muted);font-size:14px;margin:3px 0 10px}.desc{line-height:1.65;color:#344054}.check{display:block;border-top:1px solid #eee;margin-top:12px;padding-top:10px;font-weight:800}.check input{width:18px;height:18px}.big{font-size:20px;font-weight:900;margin-bottom:7px}.box{padding:15px;border-radius:15px;background:#f8fafc;margin:10px 0;line-height:1.7}.qa{border-top:1px solid #eee;padding:16px 0}.qa:first-child{border:0}.ans{color:var(--g);font-weight:850;margin-top:7px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.choice{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:750;text-align:left;cursor:pointer}.choice.sel{outline:2px solid #93c5fd;background:#eff6ff}.choice.correct{background:#dcfce7;border-color:#86efac}.choice.wrong{background:#fee2e2;border-color:#fecaca}.feedback{margin-top:8px;font-weight:800;line-height:1.55}.score{font-size:28px;color:var(--b);font-weight:950;margin-top:14px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.saved{margin-top:10px;padding:11px 13px;border-radius:12px;background:#ecfdf3;color:#166534;font-weight:800;display:none}.saved.show{display:block}.foot{margin-top:18px;margin-bottom:0}@media(max-width:680px){.grid,.choices{grid-template-columns:1fr}.hero,.panel{padding:18px}}</style></head><body><main class="w"><div class="nav"><a class="btn" href="index.html">← 首页</a><div class="tabs" id="tabs"></div></div><section class="hero"><div class="k" id="k"></div><h1 id="title"></h1><div class="sub" id="sub"></div><div class="legend" id="legend"></div></section><div id="content"></div><div class="foot" id="foot"></div></main><script src="units-data.js"></script><script>const q=new URLSearchParams(location.search),u=Number(q.get('u')||4),rawP=Number(q.get('p')||1),p=Number.isFinite(rawP)?Math.min(4,Math.max(1,rawP)):1,d=UNITS[u];if(!d){location.replace('index.html');throw new Error('Invalid unit')}const levelClass={must:'A',know:'B',support:'C'},levelText={must:'★ 必须掌握',know:'● 需要认识',support:'○ 辅助理解'},getLevel=x=>x[3]||'know';document.title=`三年级科学｜Unit ${u} ${d.title}｜Page ${p}`;k.textContent=`第 ${u} 单元 · ${d.title} · Page ${p} / 4`;title.textContent=p===1?'核心词汇':p===2?'图解理解（图片稍后补）':p===3?'题目关键词':'快速复习';sub.textContent=p===1?`先掌握「${d.topic}」真正会用到的词，并按重要程度学习。`:p===2?'先理解概念之间的关系。图片之后补入，不影响现阶段学习。':p===3?'看到题目问法，先判断它要你写名称、功能、比较、原因还是关系。':'完成后立即批改，错题会显示正确答案。';legend.innerHTML=p===1?'<span class="badge lvA">★ 必须掌握</span><span class="badge lvB">● 需要认识</span><span class="badge lvC">○ 辅助理解</span>':'';tabs.innerHTML=[1,2,3,4].map(x=>`<a class="tab ${x===p?'on':''}" href="unit.html?u=${u}&p=${x}">Page ${x}</a>`).join('');const C=document.getElementById('content');if(p===1){C.innerHTML=`<section class="grid">${d.v.map((x,i)=>{const lv=getLevel(x),cl=levelClass[lv]||'B';return `<article class="card"><div class="head"><div><div class="word">${x[0]}</div><div class="py">${x[1]}</div></div><span class="badge lv${cl}">${levelText[lv]||levelText.know}</span></div><div class="desc">${x[2]}</div><label class="check"><input type="checkbox" data-i="${i}"> 我学会了</label></article>`}).join('')}</section><section class="panel"><b>本页重点：</b>先完成 ★ 必须掌握，再学习 ● 需要认识；○ 辅助理解用于帮助看懂题目和概念。</section>`;const key=`std3-u${u}-p1`;let s={};try{s=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}document.querySelectorAll('input').forEach(x=>{x.checked=!!s[x.dataset.i];x.onchange=()=>{s[x.dataset.i]=x.checked;localStorage.setItem(key,JSON.stringify(s))}})}else if(p===2){C.innerHTML=`<section class="panel"><div class="big">${d.topic}</div>${d.p2.map((x,i)=>`<div class="box"><b>${i+1}.</b> ${x}</div>`).join('')}</section><section class="panel"><b>图片预留：</b>Unit ${u} 的专用教学图稍后加入；本页文字概念已经按锁定词汇同步。</section>`}else if(p===3){C.innerHTML=`<section class="panel">${d.p3.map((x,i)=>`<div class="qa"><div class="big">${i+1}. ${x[0]}</div><div class="ans">答题方向：${x[1]}</div></div>`).join('')}</section>`}else{function sampleEvenly(arr,n=10){if(arr.length<=n)return arr;return Array.from({length:n},(_,i)=>arr[Math.round(i*(arr.length-1)/(n-1))])}let must=d.v.filter(x=>getLevel(x)==='must'),pool=sampleEvenly(must,must.length>=8?10:8);if(pool.length<8){const extra=d.v.filter(x=>getLevel(x)!=='must'&&!pool.includes(x));pool=pool.concat(extra.slice(0,8-pool.length))}const qs=pool.map((x,i)=>{const candidates=d.v.filter(y=>y[0]!==x[0]),wrong=candidates[(i*3+u)%candidates.length][0];return{q:`哪一个词最符合这个解释：${x[2]}`,a:x[0],b:wrong}}),key=`std3-u${u}-p4`;C.innerHTML=`<section class="panel"><div class="big">${qs.length} 题核心词汇检查</div><div class="sub">题目从本单元 ★ 必须掌握词汇中均衡抽取。全部作答后再批改。</div><div id="quiz">${qs.map((z,i)=>`<div class="qa" data-a="${z.a}"><b>${i+1}. ${z.q}</b><div class="choices"><button class="choice">${z.a}</button><button class="choice">${z.b}</button></div><div class="feedback"></div></div>`).join('')}</div><div class="actions"><button class="btn" id="mark">批改答案</button><button class="btn" id="reset">重新作答</button></div><div class="score" id="score"></div><div class="saved" id="saved"></div></section>`;const rows=[...document.querySelectorAll('.qa')];rows.forEach(e=>e.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{e.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');e.dataset.pick=b.textContent}));function readSaved(){const raw=localStorage.getItem(key);if(!raw)return null;if(raw==='complete')return{completed:true};try{return JSON.parse(raw)}catch(e){return null}}const old=readSaved();if(old?.completed){saved.textContent=Number.isFinite(old.score)?`上次得分：${old.score} / ${old.total}，本单元已完成。`:'本单元之前已完成。';saved.classList.add('show')}mark.onclick=()=>{let n=0,all=true;rows.forEach(e=>{e.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','wrong'));const f=e.querySelector('.feedback');if(!e.dataset.pick){all=false;f.textContent='尚未作答';return}const ok=e.dataset.pick===e.dataset.a;if(ok)n++;e.querySelectorAll('.choice').forEach(b=>{if(b.textContent===e.dataset.a)b.classList.add('correct');else if(b.textContent===e.dataset.pick)b.classList.add('wrong')});f.textContent=ok?'正确':'错误。正确答案：'+e.dataset.a});score.textContent=all?`${n} / ${qs.length}`:`${n} / ${qs.length}（还有题目未作答）`;if(all){const completed=n/qs.length>=.75;localStorage.setItem(key,JSON.stringify({score:n,total:qs.length,completed}));saved.textContent=completed?'达到 75% 或以上，本单元已完成。':'未达到完成标准，请订正后重新作答。';saved.classList.add('show')}};reset.onclick=()=>{rows.forEach(e=>{delete e.dataset.pick;e.querySelectorAll('.choice').forEach(b=>b.classList.remove('sel','correct','wrong'));e.querySelector('.feedback').textContent=''});score.textContent='';saved.classList.remove('show');saved.textContent='';localStorage.removeItem(key)}}document.getElementById('foot').innerHTML=`${p>1?`<a class="btn" href="unit.html?u=${u}&p=${p-1}">← Page ${p-1}</a>`:'<a class="btn" href="index.html">← 单元目录</a>'}${p<4?`<a class="btn" href="unit.html?u=${u}&p=${p+1}">Page ${p+1} →</a>`:'<a class="btn" href="index.html">完成 · 返回首页</a>'}`;</script></body></html>
