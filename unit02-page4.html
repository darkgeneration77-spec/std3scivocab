<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第二单元：科学室规则｜快速复习</title><style>:root{--bg:#f6f8fb;--text:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--shadow:0 14px 36px rgba(23,32,51,.08)}*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1000px;margin:auto;padding:28px 18px 56px}.top,.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}.btn{border:1px solid var(--line);background:#fff;color:#344054;padding:10px 14px;border-radius:12px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:var(--blue);color:#fff}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow);margin-bottom:22px}.kicker{color:var(--blue);font-weight:900}h1{font-size:clamp(28px,4vw,44px);margin:8px 0}.sub{color:var(--muted);line-height:1.7}.q{padding:17px 0;border-top:1px solid #eef1f5}.q:first-child{border-top:0}.qt{font-weight:900;line-height:1.6;margin-bottom:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:left;font-weight:800;cursor:pointer}.choice.correct{background:#dcfce7}.choice.wrong{background:#fee2e2}.feedback{font-size:14px;font-weight:800;margin-top:8px;min-height:20px}.result{font-size:26px;font-weight:900}.wrong{background:#fff7ed;border-radius:12px;padding:11px;margin-top:10px;line-height:1.6}@media(max-width:600px){main{padding:18px 12px}.choices{grid-template-columns:1fr}.hero,.panel{border-radius:18px}}</style></head><body><main><div class="top"><div><a class="btn" href="index.html">← 首页</a> <a class="btn" href="unit02-page3.html">← Page 3</a></div><button class="btn primary" onclick="checkAll()">检查全部</button></div><section class="hero"><div class="kicker">第二单元 · 科学室规则 · Page 4 / 4</div><h1>快速复习</h1><p class="sub">10题覆盖允许、指示、器材、材料、禁止、意外、报告、清理和归位。</p></section><section class="panel" id="quiz"></section><section class="panel"><div class="result" id="score">得分：0 / 10</div><div id="status" class="sub">完成后按「检查全部」。</div><div id="wrongs"></div><p><button class="btn" onclick="resetQuiz()">重新作答</button></p></section><div class="footer"><a class="btn" href="unit02-page3.html">← Page 3</a><a class="btn primary" href="index.html">完成 Unit 2 → 首页</a></div></main><script>const data=[['没有老师允许时，学生应该怎样做？','等待老师允许',['自己进入','等待老师允许'],'进入科学室前要先获得老师允许。'],['活动开始前最重要的是？','听从老师指示',['听从老师指示','自己决定步骤'],'科学活动要按照老师指示进行。'],['科学器材应该怎样使用？','按照正确方法使用',['当玩具使用','按照正确方法使用'],'器材要正确并小心使用。'],['不认识的材料可以直接品尝吗？','不可以',['可以','不可以'],'未知材料不能随意品尝或触碰。'],['在科学室奔跑属于什么行为？','禁止行为',['允许行为','禁止行为'],'奔跑可能造成受伤或器材损坏。'],['器材打破后第一步应该做什么？','立即报告老师',['立即报告老师','把碎片藏起来'],'发生意外要立即报告老师。'],['材料不小心洒出时应该怎样做？','报告老师并听从指示',['自己随便处理','报告老师并听从指示'],'意外情况应报告并按指示处理。'],['活动完成后先要做什么？','清理',['离开','清理'],'结束后要清理桌面、器材和环境。'],['清理后器材应该怎样处理？','放回正确位置',['带回家','放回正确位置'],'器材使用后应归位。'],['遵守科学室规则最主要是为了什么？','保持安全',['让活动更慢','保持安全'],'规则的核心是保护学生、器材和环境安全。']];quiz.innerHTML=data.map((x,i)=>`<div class="q" data-a="${x[1]}" data-e="${x[3]}"><div class="qt">${i+1}. ${x[0]}</div><div class="choices">${x[2].map(c=>`<button class="choice">${c}</button>`).join('')}</div><div class="feedback"></div></div>`).join('');const qs=[...document.querySelectorAll('.q')];qs.forEach(q=>q.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{q.querySelectorAll('.choice').forEach(x=>{x.dataset.sel='';x.style.outline=''});b.dataset.sel='1';b.style.outline='2px solid #93c5fd'}));function checkAll(){let s=0,a=0,w=[];qs.forEach((q,i)=>{let sel=[...q.querySelectorAll('.choice')].find(b=>b.dataset.sel==='1');q.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','wrong'));let f=q.querySelector('.feedback');if(!sel){f.textContent='尚未作答。';w.push(`第 ${i+1} 题未作答。${q.dataset.e}`);return}a++;let ok=sel.textContent===q.dataset.a;q.querySelectorAll('.choice').forEach(b=>{if(b.textContent===q.dataset.a)b.classList.add('correct')});if(ok){s++;f.textContent='正确。'}else{sel.classList.add('wrong');f.textContent=`错误。正确答案：${q.dataset.a}。${q.dataset.e}`;w.push(`第 ${i+1} 题：${q.dataset.e}`)}});score.textContent=`得分：${s} / 10`;status.textContent=a<10?`已完成 ${a}/10 题。`:s>=9?'掌握良好，可以进入下一单元。':s>=7?'基本掌握，请订正错题。':'建议回到 Page 2–3 复习。';wrongs.innerHTML=w.map(x=>`<div class="wrong">${x}</div>`).join('');localStorage.setItem('std3-sci-unit02-page4-v2',JSON.stringify({score:s,answered:a,completed:a===10&&s>=9}))}function resetQuiz(){qs.forEach(q=>{q.querySelectorAll('.choice').forEach(b=>{b.dataset.sel='';b.classList.remove('correct','wrong');b.style.outline=''});q.querySelector('.feedback').textContent=''});score.textContent='得分：0 / 10';status.textContent='完成后按「检查全部」。';wrongs.innerHTML='';localStorage.removeItem('std3-sci-unit02-page4-v2')}</script></body></html>
