<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第二单元：科学室规则｜核心词汇</title><style>:root{--bg:#f6f8fb;--text:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1180px;margin:auto;padding:26px 16px 56px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.btn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:#344054;font-weight:800}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;margin-bottom:20px}.k{color:var(--blue);font-weight:900}.sub{color:var(--muted);line-height:1.7}.track{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue)}.pt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 0 6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.card.done{outline:2px solid #bbf7d0}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:22px;font-weight:900}.py{color:var(--muted);font-size:13px;margin-top:3px}.level{font-size:11px;font-weight:900;background:#eaf2ff;color:#1d4ed8;padding:5px 8px;border-radius:99px;height:max-content}.level.b{background:#f2f4f7;color:#475467}.desc{line-height:1.6;margin:10px 0;color:#344054}.check{display:flex;gap:8px;align-items:center;border-top:1px solid #eee;padding-top:9px;font-weight:800}.check input{width:18px;height:18px}.note{background:#eff6ff;color:#1e40af;border-radius:16px;padding:16px;margin-top:20px;line-height:1.7;font-weight:800}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><a class="btn" href="index.html">← 首页</a><a class="btn" href="unit02-page2.html">Page 2 →</a></div><section class="hero"><div class="k">第二单元 · 科学室规则 · Page 1 / 4</div><h1>完整科学室词汇</h1><p class="sub">补齐课本常见的安全行为、意外情况与处理词。</p><div class="pt"><span>学习进度</span><strong id="count"></strong></div><div class="track"><div class="bar" id="bar"></div></div></section><section class="grid" id="cards"></section><div class="note">主线：获得允许 → 听从指示 → 正确使用 → 避免危险行为 → 发生意外立即报告 → 清理 → 归位。</div></main><script>const data=[['科学室','kē xué shì','进行科学活动和实验的地方。','A'],['规则','guī zé','在科学室必须遵守的规定。','A'],['安全','ān quán','避免自己和别人受到伤害。','A'],['允许','yǔn xǔ','得到老师同意后才进行行动。','A'],['指示','zhǐ shì','老师说明应该怎样进行活动。','A'],['器材','qì cái','进行科学活动时使用的工具。','A'],['材料','cái liào','科学活动中使用或观察的物品。','A'],['正确使用','zhèng què shǐ yòng','按照正确方法操作器材和材料。','A'],['小心','xiǎo xīn','进行活动和操作时注意安全。','B'],['禁止','jìn zhǐ','表示某种行为不可以进行。','A'],['危险','wēi xiǎn','可能造成受伤、损坏或意外的情况。','B'],['奔跑','bēn pǎo','科学室内不应进行的危险行为。','B'],['玩耍','wán shuǎ','科学室内不应随意进行的行为。','B'],['品尝','pǐn cháng','未经老师允许不可尝试科学材料。','B'],['意外','yì wài','活动中突然发生的受伤、洒出或损坏等情况。','A'],['受伤','shòu shāng','身体受到伤害。','B'],['损坏','sǔn huài','器材或物品破裂、失灵或不能正常使用。','B'],['洒出','sǎ chū','液体或材料意外倒出。','B'],['报告','bào gào','发生意外或发现问题时立即告诉老师。','A'],['清理','qīng lǐ','活动结束后整理并清洁桌面、器材和环境。','A'],['归位','guī wèi','把器材和材料放回指定的正确位置。','A']];cards.innerHTML=data.map((x,i)=>`<article class="card" data-i="${i}"><div class="head"><div><div class="word">${x[0]}</div><div class="py">${x[1]}</div></div><span class="level ${x[3]==='B'?'b':''}">${x[3]==='A'?'★ 必须掌握':'● 需要认识'}</span></div><div class="desc">${x[2]}</div><label class="check"><input type="checkbox">我学会了</label></article>`).join('');const KEY='std3-sci-unit02-page1-v2',saved=JSON.parse(localStorage.getItem(KEY)||'{}'),all=[...document.querySelectorAll('.card')];all.forEach(c=>{let b=c.querySelector('input');b.checked=!!saved[c.dataset.i];b.onchange=update});function update(){let s={},n=0;all.forEach(c=>{let b=c.querySelector('input');s[c.dataset.i]=b.checked;if(b.checked)n++;c.classList.toggle('done',b.checked)});localStorage.setItem(KEY,JSON.stringify(s));count.textContent=`${n} / ${all.length}`;bar.style.width=`${n/all.length*100}%`}update();</script></body></html>
