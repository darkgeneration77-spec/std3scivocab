<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第三单元：人类｜核心词汇</title><style>:root{--bg:#f7f8fc;--text:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1180px;margin:auto;padding:26px 16px 56px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.btn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:#344054;font-weight:800}.hero{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;margin-bottom:20px}.k{color:var(--blue);font-weight:900}.sub{color:var(--muted);line-height:1.7}.track{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue)}.pt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 0 6px}.group{margin:24px 0 10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.card.done{outline:2px solid #bbf7d0}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:22px;font-weight:900}.py{color:var(--muted);font-size:13px;margin-top:3px}.level{font-size:11px;font-weight:900;background:#eaf2ff;color:#1d4ed8;padding:5px 8px;border-radius:99px;height:max-content}.level.b{background:#f2f4f7;color:#475467}.desc{line-height:1.6;margin:10px 0;color:#344054}.check{display:flex;gap:8px;align-items:center;border-top:1px solid #eee;padding-top:9px;font-weight:800}.check input{width:18px;height:18px}.note{background:#eff6ff;color:#1e40af;border-radius:16px;padding:16px;margin-top:20px;line-height:1.7;font-weight:800}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><a class="btn" href="index.html">← 首页</a><a class="btn" href="unit03-page2.html">Page 2 →</a></div><section class="hero"><div class="k">第三单元 · 人类 · Page 1 / 4</div><h1>完整人类单元词汇</h1><p class="sub">按牙齿、食物与均衡饮食、消化三部分补齐课本常见生字和科学词。</p><div class="pt"><span>学习进度</span><strong id="count"></strong></div><div class="track"><div class="bar" id="bar"></div></div></section><div id="content"></div><div class="note">本单元体量本来就大。重点不是把词压少，而是让学生看到课本时不会再被小肠、大肠、补牙、牙套等词卡住。</div></main><script>const groups=[['A. 牙齿',[['门牙','mén yá','位于前方，主要用来切断食物。','A'],['犬齿','quǎn chǐ','较尖，主要用来撕裂食物。','A'],['臼齿','jiù chǐ','表面较宽，主要用来磨碎食物。','A'],['乳牙','rǔ yá','儿童早期长出的第一组牙齿，会逐渐脱落。','A'],['恒牙','héng yá','乳牙脱落后长出的牙齿，需要长期使用。','A'],['牙釉质','yá yòu zhì','牙齿最外层坚硬的部分。','A'],['牙本质','yá běn zhì','位于牙釉质里面的牙齿组织。','A'],['神经','shén jīng','位于牙齿内部，能感受刺激。','A'],['血管','xuè guǎn','位于牙齿内部，输送血液。','A'],['牙龈','yá yín','包围和保护牙齿根部的组织。','A'],['牙齿护理','yá chǐ hù lǐ','通过正确清洁和检查保持牙齿健康。','A'],['刷牙','shuā yá','用牙刷和牙膏清洁牙齿。','B'],['牙刷','yá shuā','刷牙时使用的清洁工具。','B'],['牙膏','yá gāo','刷牙时配合牙刷使用的清洁用品。','B'],['牙线','yá xiàn','清理牙齿之间食物残渣的用品。','B'],['牙科检查','yá kē jiǎn chá','让牙医检查牙齿健康情况。','B'],['补牙','bǔ yá','修补蛀坏牙齿的一种牙科处理。','B'],['牙套','yá tào','帮助矫正牙齿排列的装置。','B'],['假牙','jiǎ yá','用来代替缺失牙齿的人工牙齿。','B']]],['B. 食物与均衡饮食',[['碳水化合物','tàn shuǐ huà hé wù','主要为身体提供能量。','A'],['蛋白质','dàn bái zhì','帮助身体生长和修复组织。','A'],['脂肪','zhī fáng','提供能量并帮助身体保暖。','A'],['维生素','wéi shēng sù','帮助身体保持健康。','A'],['矿物质','kuàng wù zhì','身体保持健康所需要的一类营养。','A'],['膳食纤维','shàn shí xiān wéi','帮助排便并预防便秘。','A'],['水','shuǐ','帮助维持正常功能和调节体温。','A'],['食物类别','shí wù lèi bié','按主要营养功能把食物分成不同类别。','B'],['均衡饮食','jūn héng yǐn shí','按照身体需要适量摄取不同类别食物。','A'],['马来西亚食物金字塔','mǎ lái xī yà shí wù jīn zì tǎ','帮助了解各类食物建议摄取量的图示。','A']]],['C. 消化',[['消化','xiāo huà','食物被分解成较小部分，让营养更容易被吸收的过程。','A'],['消化器官','xiāo huà qì guān','参与消化过程的身体器官。','B'],['消化道','xiāo huà dào','食物在身体内经过的一连串通道。','B'],['口腔','kǒu qiāng','食物进入消化道并开始被处理的地方。','A'],['唾液','tuò yè','在口腔中帮助食物变湿并容易吞咽。','B'],['食道','shí dào','把食物从口腔送往胃的通道。','A'],['胃','wèi','继续处理和消化食物的器官。','A'],['小肠','xiǎo cháng','继续消化并吸收大量营养的部位。','A'],['大肠','dà cháng','吸收部分水分并形成排泄物的部位。','A'],['肛门','gāng mén','消化道末端，排出不能消化的物质。','A'],['吸收','xī shōu','身体把消化后的营养吸收到体内使用。','A'],['营养','yíng yǎng','身体从食物中取得并用于生长和活动的物质。','A'],['消化路线','xiāo huà lù xiàn','食物依次经过口腔、食道、胃、小肠、大肠和肛门。','A']]]];const flat=groups.flatMap(g=>g[1]);content.innerHTML=groups.map(([name,arr])=>`<h2 class="group">${name}</h2><section class="grid">${arr.map(x=>{let i=flat.indexOf(x);return `<article class="card" data-i="${i}"><div class="head"><div><div class="word">${x[0]}</div><div class="py">${x[1]}</div></div><span class="level ${x[3]==='B'?'b':''}">${x[3]==='A'?'★ 必须掌握':'● 需要认识'}</span></div><div class="desc">${x[2]}</div><label class="check"><input type="checkbox">我学会了</label></article>`}).join('')}</section>`).join('');const KEY='std3-sci-unit03-page1-v2',saved=JSON.parse(localStorage.getItem(KEY)||'{}'),cards=[...document.querySelectorAll('.card')];cards.forEach(c=>{let b=c.querySelector('input');b.checked=!!saved[c.dataset.i];b.onchange=update});function update(){let s={},n=0;cards.forEach(c=>{let b=c.querySelector('input');s[c.dataset.i]=b.checked;if(b.checked)n++;c.classList.toggle('done',b.checked)});localStorage.setItem(KEY,JSON.stringify(s));count.textContent=`${n} / ${cards.length}`;bar.style.width=`${n/cards.length*100}%`}update();</script></body></html>
