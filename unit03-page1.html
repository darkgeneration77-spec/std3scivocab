<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第三单元：人类｜核心词汇</title><style>:root{--bg:#f7f8fc;--text:#172033;--muted:#667085;--line:#e5e7eb;--blue:#2563eb;--green:#16a34a;--shadow:0 14px 36px rgba(23,32,51,.08)}*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#fbfcff,var(--bg));color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:28px 18px 56px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.btn{text-decoration:none;color:#344054;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:800}.progress{min-width:250px}.pt{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:7px}.track{height:9px;background:#e9eef5;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue)}.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);margin-bottom:22px}.kicker{font-size:14px;font-weight:900;color:var(--blue);margin-bottom:8px}h1{margin:0;font-size:clamp(28px,4vw,44px)}.sub{color:var(--muted);line-height:1.7}.group{margin:28px 0 12px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 24px rgba(23,32,51,.05)}.card.done{outline:2px solid rgba(22,163,74,.2)}.head{display:flex;justify-content:space-between;gap:10px}.word{font-size:22px;font-weight:900}.pinyin{font-size:13px;color:var(--muted);margin-top:4px}.level{font-size:11px;font-weight:900;background:#eaf2ff;color:var(--blue);padding:5px 8px;border-radius:999px;height:max-content;white-space:nowrap}.second{background:#f2f4f7;color:#475467}.desc{line-height:1.65;color:#344054;margin:11px 0 13px}.check{border-top:1px solid #eef1f5;padding-top:10px;display:flex;gap:8px;align-items:center;font-weight:800;cursor:pointer}.check input{width:19px;height:19px;accent-color:var(--green)}.note{margin-top:22px;background:#eff6ff;color:#1e40af;border-radius:18px;padding:18px;line-height:1.8;font-weight:800}.footer{display:flex;justify-content:space-between;margin-top:22px;gap:12px;flex-wrap:wrap}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:18px 12px 40px}.top{flex-direction:column;align-items:flex-start}.progress{width:100%}.grid{grid-template-columns:1fr}.hero{border-radius:18px}}</style></head><body><main class="wrap"><div class="top"><a class="btn" href="index.html">← 首页</a><div class="progress"><div class="pt"><span>Page 1 学习进度</span><strong id="count">0 / 32</strong></div><div class="track"><div class="bar" id="bar"></div></div></div></div><section class="hero"><div class="kicker">第三单元 · 人类 · Page 1 / 4</div><h1>核心词汇</h1><p class="sub">本单元分成牙齿、食物与均衡饮食、消化三部分。先掌握核心词，再进入概念关系与练习。</p></section><div id="content"></div><div class="note">学习顺序：先认牙齿种类与结构 → 再掌握七类食物与均衡饮食 → 最后记住消化路线与吸收概念。</div><div class="footer"><a class="btn" href="index.html">← 返回首页</a><a class="btn" href="unit03-page2.html">Page 2 图解理解 →</a></div></main><script>const groups=[['A. 牙齿',[['incisor','门牙','mén yá','位于前方，主要用来切断食物。','must'],['canine','犬齿','quǎn chǐ','较尖，主要用来撕裂食物。','must'],['molar','臼齿','jiù chǐ','表面较宽，主要用来磨碎食物。','must'],['milk','乳牙','rǔ yá','儿童早期长出的第一组牙齿，会逐渐脱落。','must'],['perm','恒牙','héng yá','乳牙脱落后长出的牙齿，需要长期使用。','must'],['enamel','牙釉质','yá yòu zhì','牙齿最外层坚硬的部分。','must'],['dentine','牙本质','yá běn zhì','位于牙釉质里面的牙齿组织。','must'],['nerve','神经','shén jīng','位于牙齿内部，能感受刺激。','must'],['vessel','血管','xuè guǎn','位于牙齿内部，输送血液。','must'],['gum','牙龈','yá yín','包围和保护牙齿根部的组织。','must'],['care','牙齿护理','yá chǐ hù lǐ','通过正确清洁和检查保持牙齿健康。','must'],['floss','牙线','yá xiàn','清理牙齿之间食物残渣的用品。','know'],['dentist','牙科检查','yá kē jiǎn chá','定期让牙医检查牙齿健康情况。','know']]],['B. 食物与均衡饮食',[['carb','碳水化合物','tàn shuǐ huà hé wù','主要为身体提供能量的食物类别。','must'],['protein','蛋白质','dàn bái zhì','帮助身体生长和修复组织。','must'],['fat','脂肪','zhī fáng','提供能量，并帮助身体保暖。','must'],['vitamin','维生素','wéi shēng sù','帮助身体保持健康。','must'],['mineral','矿物质','kuàng wù zhì','身体保持健康所需要的一类营养。','must'],['fibre','膳食纤维','shàn shí xiān wéi','帮助排便，预防便秘。','must'],['water','水','shuǐ','帮助维持身体正常功能和调节体温。','must'],['balanced','均衡饮食','jūn héng yǐn shí','按照身体需要适量摄取不同类别的食物。','must'],['pyramid','食物金字塔','shí wù jīn zì tǎ','帮助了解不同食物类别建议摄取量的图示。','must']]],['C. 消化',[['digest','消化','xiāo huà','食物被分解成较小部分，让营养更容易被身体吸收的过程。','must'],['mouth','口腔','kǒu qiāng','食物进入消化道并开始被处理的地方。','must'],['saliva','唾液','tuò yè','在口腔中帮助食物变湿并容易吞咽。','know'],['oesophagus','食道','shí dào','把食物从口腔送往胃的通道。','must'],['stomach','胃','wèi','消化道中继续处理食物的器官。','must'],['intestine','肠','cháng','消化后的营养在这里继续被身体吸收。','must'],['anus','肛门','gāng mén','消化道末端，排出不能消化的物质。','must'],['absorb','吸收','xī shōu','身体把消化后的营养带入体内使用。','must'],['nutrition','营养','yíng yǎng','身体从食物中获得并用来生长、活动和保持健康的物质。','must'],['route','消化路线','xiāo huà lù xiàn','食物依次经过口腔、食道、胃、肠和肛门。','must']]]];const levelText={must:'★ 必须掌握',know:'● 需要认识'};content.innerHTML=groups.map(g=>`<h2 class="group">${g[0]}</h2><section class="grid">${g[1].map(x=>`<article class="card" data-k="${x[0]}"><div class="head"><div><div class="word">${x[1]}</div><div class="pinyin">${x[2]}</div></div><span class="level ${x[4]==='know'?'second':''}">${levelText[x[4]]}</span></div><div class="desc">${x[3]}</div><label class="check"><input type="checkbox">我学会了</label></article>`).join('')}</section>`).join('');const KEY='std3-sci-unit03-page1-v2',cards=[...document.querySelectorAll('.card')];let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}function update(){let n=0,s={};cards.forEach(c=>{const x=c.querySelector('input');s[c.dataset.k]=x.checked;if(x.checked)n++;c.classList.toggle('done',x.checked)});localStorage.setItem(KEY,JSON.stringify(s));count.textContent=`${n} / ${cards.length}`;bar.style.width=`${n/cards.length*100}%`}cards.forEach(c=>{const x=c.querySelector('input');x.checked=!!saved[c.dataset.k];x.addEventListener('change',update)});update();</script></body></html>
