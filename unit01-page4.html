<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级科学｜第一单元：科学技能｜挑战测试</title><link rel="stylesheet" href="theme.css"><style>.challengeVisual{background:#fff;border:1px solid #e5e7eb;border-radius:26px;padding:12px;box-shadow:0 14px 34px rgba(23,32,51,.07);margin:18px 0 22px}.challengeVisual img{display:block;width:100%;border-radius:20px}.quizHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.quizHead h2{margin:0;font-size:28px}.q{padding:20px 0;border-top:1px solid #eef1f5}.q:first-child{border-top:0}.qt{font-size:20px;font-weight:900;line-height:1.65;margin-bottom:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:13px;text-align:left;font-size:17px;font-weight:850;cursor:pointer;transition:.15s}.choice:hover{border-color:#93c5fd;background:#f8fbff}.choice.correct{background:#dcfce7;border-color:#86efac}.choice.wrong{background:#fee2e2;border-color:#fca5a5}.feedback{font-size:16px;font-weight:800;margin-top:10px;min-height:22px;line-height:1.6}.result{font-size:28px;font-weight:950}.wrongbox{margin-top:10px;background:#fff7ed;border:1px solid #fed7aa;padding:13px 15px;border-radius:14px;line-height:1.65}.resultPanel{text-align:center}.resultPanel .sub{font-size:18px;margin:10px 0}.checkBtn{font-size:18px;padding:13px 20px}.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:7px 12px;font-weight:900;margin-bottom:10px}@media(max-width:620px){.choices{grid-template-columns:1fr}.challengeVisual{padding:7px}.qt{font-size:18px}.quizHead h2{font-size:24px}}</style></head><body><main class="w"><div class="nav"><a class="btn" href="index.html">← 首页</a><div class="tabs"><a class="tab" href="unit01-page1.html">认识词汇</a><a class="tab" href="unit01-page2.html">看图理解</a><a class="tab" href="unit01-page3.html">学会答题</a><a class="tab on" href="unit01-page4.html">挑战测试</a></div></div><section class="hero"><div class="k">UNIT 01 · 科学技能 · 第 4 站</div><h1>挑战测试：你真的学会了吗？</h1><div class="sub">完成 12 题，检查科学程序技能、资料记录和科学操作技能。答错会显示原因，马上订正，不靠猜。</div></section><section class="challengeVisual"><img src="unit01-page4-challenge.png" alt="科学技能挑战测试总复习图"></section><section class="panel"><div class="quizHead"><div><span class="badge">12 题挑战</span><h2>开始测试</h2></div><button class="btn primary checkBtn" onclick="checkAll()">检查全部答案</button></div><div id="quiz"></div></section><section class="panel resultPanel"><div class="result" id="score">得分：0 / 12</div><div id="status" class="sub">完成所有题目后按「检查全部答案」。</div><div id="wrongs"></div><p><button class="btn" onclick="resetQuiz()">重新作答</button></p></section><div class="foot"><a class="btn" href="unit01-page3.html">← 学会答题</a><a class="btn primary" href="index.html">完成 Unit 01 → 返回首页</a></div></main><script>const KEY='std3-sci-unit01-page4-v2',data=[['实际看到植物叶子下垂，属于什么技能？','观察',['观察','推断','预测','分类'],'观察写实际现象。'],['根据叶子下垂判断植物可能缺水，属于什么技能？','推断',['观察','推断','预测','沟通'],'推断是根据观察解释可能原因。'],['根据已有资料判断植物接下来可能枯萎，属于什么技能？','预测',['预测','分类','观察','绘画'],'预测写接下来可能发生的情况。'],['根据叶子的形状把植物分组，属于什么技能？','分类',['分类','推断','清洗','储存'],'分类要根据相同或不同特征分组。'],['记录“长度是 15 cm”时，除了数值还必须注意什么？','标准单位',['标准单位','标本','感官','预测'],'测量结果要配合正确的标准单位。'],['实验结果整理成表格给同学看，属于什么技能？','沟通',['沟通','推断','分类','储存'],'沟通可以用文字、图画、表格等表达资料。'],['观察或测量后得到的信息称为什么？','资料',['资料','标本','器材','材料'],'科学活动中收集到的信息是资料。'],['把观察或测量结果写下来，称为什么？','记录',['记录','推断','预测','分类'],'记录能保存科学活动所得的资料。'],['进行科学活动时，器材和材料应该怎样使用？','正确操作',['正确操作','随意操作','先猜答案','不用检查'],'器材、材料和标本必须依照正确方法安全处理。'],['需要把观察到的标本形状表达出来，可以使用哪项操作技能？','绘画',['绘画','预测','储存','分类'],'绘画是科学操作技能之一。'],['科学器材使用后应该先做什么？','清洗',['清洗','丢弃','预测','分类'],'使用后的器材应按正确方法清洗。'],['清洗器材后，还应该怎样处理？','储存',['储存','推断','预测','分类'],'器材和材料应安全放回正确位置。']];const quiz=document.getElementById('quiz');quiz.innerHTML=data.map((x,i)=>`<div class="q" data-a="${x[1]}" data-e="${x[3]}"><div class="qt">${i+1}. ${x[0]}</div><div class="choices">${x[2].map(c=>`<button class="choice">${c}</button>`).join('')}</div><div class="feedback"></div></div>`).join('');const qs=[...document.querySelectorAll('.q')];qs.forEach(q=>q.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{q.querySelectorAll('.choice').forEach(x=>{x.dataset.sel='';x.style.outline=''});b.dataset.sel='1';b.style.outline='3px solid #93c5fd'}));function checkAll(){let s=0,a=0,w=[];qs.forEach((q,i)=>{let sel=[...q.querySelectorAll('.choice')].find(b=>b.dataset.sel==='1');q.querySelectorAll('.choice').forEach(b=>b.classList.remove('correct','wrong'));let fb=q.querySelector('.feedback');if(!sel){fb.textContent='尚未作答。';w.push(`第 ${i+1} 题未作答。${q.dataset.e}`);return}a++;let ok=sel.textContent===q.dataset.a;q.querySelectorAll('.choice').forEach(b=>{if(b.textContent===q.dataset.a)b.classList.add('correct')});if(ok){s++;fb.textContent='正确。'}else{sel.classList.add('wrong');fb.textContent=`错误。正确答案：${q.dataset.a}。${q.dataset.e}`;w.push(`第 ${i+1} 题：${q.dataset.e}`)}});score.textContent=`得分：${s} / 12`;status.textContent=a<12?`已完成 ${a}/12 题。请完成所有题目。`:s>=10?'掌握良好，Unit 01 挑战完成。':s>=8?'基本掌握，请先订正错题再重做。':'需要回到「看图理解」和「学会答题」复习。';wrongs.innerHTML=w.map(x=>`<div class="wrongbox">${x}</div>`).join('');localStorage.setItem(KEY,JSON.stringify({score:s,answered:a,completed:a===12&&s>=10}))}function resetQuiz(){qs.forEach(q=>{q.querySelectorAll('.choice').forEach(b=>{b.dataset.sel='';b.classList.remove('correct','wrong');b.style.outline=''});q.querySelector('.feedback').textContent=''});score.textContent='得分：0 / 12';status.textContent='完成所有题目后按「检查全部答案」。';wrongs.innerHTML='';localStorage.removeItem(KEY)}try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isFinite(old.score)){score.textContent=`上次得分：${old.score} / 12`;status.textContent=old.completed?'Unit 01 之前已经完成挑战。':'上次未达到完成标准，可以重新作答。'}}catch(e){}</script></body></html>
