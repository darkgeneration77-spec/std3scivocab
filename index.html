<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>三年级科学核心词汇</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#eef6ff,#fff);color:#1e2a3a}.w{width:min(1120px,92vw);margin:auto;padding:38px 0 70px}.hero,.card{background:#fff;border:1px solid #e5edf6;box-shadow:0 12px 32px #3d5b7d14;border-radius:24px}.hero{padding:32px;margin-bottom:26px}.ey{color:#4f7fb5;font-weight:900;font-size:14px}.hero h1{font-size:clamp(32px,5vw,52px);margin:8px 0}.hero p{color:#65758a;line-height:1.7}.bar{height:11px;background:#e7eef7;border-radius:99px;overflow:hidden;margin-top:18px}.bar span{display:block;width:100%;height:100%;background:#5b8fd6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{padding:21px;position:relative}.num{font-size:12px;font-weight:900;color:#7c9fc6}.card h2{margin:8px 0;font-size:23px}.card p{color:#6f7f91;margin:0;line-height:1.6}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.tag{padding:7px 10px;border-radius:99px;background:#e8f6ee;color:#347a53;text-decoration:none;font-size:12px;font-weight:850}.done:after{content:'4 / 4';position:absolute;right:18px;top:17px;background:#e8f6ee;color:#347a53;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900}.note{margin:22px 4px;color:#718096;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:23px}}</style></head><body><main class="w"><section class="hero"><div class="ey">三年级科学 · 核心词汇学习站</div><h1>Unit 1–10 学习骨架完成</h1><p>所有单元已经开放四页。Unit 4–10 先锁定核心词汇和概念，教学图片下一轮再补。</p><div class="bar"><span></span></div></section><section class="grid"><div class="card done"><div class="num">UNIT 01</div><h2>科学技能</h2><p>观察、分类、测量、推断、预测与沟通。</p><div class="tags"><a class="tag" href="unit01-page1.html">Page 1</a><a class="tag" href="unit01-page2.html">Page 2</a><a class="tag"
