<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>三年级科学探索站</title><style>:root{--ink:#172033;--muted:#667085;--line:#e7eaf0;--green:#20a464;--yellow:#ffd75e;--blue:#67a8ff;--shadow:0 12px 0 rgba(23,32,51,.06)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f8faf7;color:var(--ink)}button,a{font:inherit}.shell{width:min(1180px,94vw);margin:auto;padding:24px 0 72px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-weight:950;font-size:18px}.logo{width:42px;height:42px;border-radius:14px;background:#dff5e9;display:grid;place-items:center;font-size:23px}.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:850;color:#596579}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-bottom:24px}.welcome,.mission{border-radius:30px;padding:32px;position:relative;overflow:hidden}.welcome{background:#dff5e9;min-height:270px}.welcome:after{content:'✦';position:absolute;right:34px;top:22px;font-size:88px;color:#b8e6ce;transform:rotate(14deg)}.ey{font-size:13px;font-weight:950;letter-spacing:.08em;color:#39805b}.welcome h1{font-size:clamp(35px,5vw,60px);line-height:1.03;margin:12px 0 14px;max-width:700px}.welcome p{font-size:16px;color:#4f685b;line-height:1.7;max-width:650px}.mission{background:#172033;color:#fff;display:flex;flex-direction:column;justify-content:space-between}.mission small{color:#aeb9ca;font-weight:850}.mission strong{font-size:42px}.mission .track{height:13px;background:#303b50;border-radius:99px;overflow:hidden}.mission .track span{display:block;height:100%;width:0;background:#76df9f;border-radius:99px;transition:.3s}.mission p{color:#c4ccda;margin:8px 0 18px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:30px 2px 15px}.sectionHead h2{margin:0;font-size:25px}.sectionHead span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.unit{background:#fff;border:2px solid var(--line);border-radius:27px;padding:21px;display:grid;grid-template-columns:90px 1fr;gap:18px;box-shadow:var(--shadow);transition:.18s}.unit:hover{transform:translateY(-3px);box-shadow:0 15px 0 rgba(23,32,51,.07)}.visual{height:90px;border-radius:22px;display:grid;place-items:center;font-size:42px;font-weight:900}.u1 .visual,.u6 .visual{background:#dfeeff}.u2 .visual,.u8 .visual{background:#fff0c7}.u3 .visual,.u7 .visual{background:#ffe1df}.u4 .visual,.u5 .visual{background:#dff5e9}.u9 .visual{background:#e8e1ff}.u10 .visual{background:#e8edf3}.meta{font-size:11px;font-weight:950;letter-spacing:.08em;color:#8993a3}.unit h3{margin:5px 0 5px;font-size:23px}.unit p{margin:0;color:#667085;line-height:1.5;font-size:13px}.route{display:flex;align-items:center;gap:7px;margin-top:14px;flex-wrap:wrap}.step{width:34px;height:34px;border-radius:50%;border:2px solid #e5e8ed;background:#f8fafc;display:grid;place-items:center;text-decoration:none;color:#687386;font-size:12px;font-weight:950;transition:.15s}.step:hover{border-color:#94a3b8;transform:scale(1.06)}.step.done{background:#dcf7e7;border-color:#8bd6aa;color:#23764b}.go{margin-left:auto;text-decoration:none;background:#172033;color:#fff;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:900}.state{display:inline-flex;margin-top:10px;border-radius:99px;padding:5px 9px;background:#f2f4f7;color:#667085;font-size:11px;font-weight:900}.state.complete{background:#dcf7e7;color:#23764b}.legend{margin-top:25px;background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px 20px;color:#667085;font-size:13px;line-height:1.7}.legend strong{color:#344054}@media(max-width:850px){.hero{grid-template-columns:1fr}.mission{min-height:200px}.grid{grid-template-columns:1fr}}@media(max-width:560px){.shell{width:min(94vw,520px);padding-top:14px}.nav{margin-bottom:14px}.welcome,.mission{padding:24px;border-radius:24px}.welcome{min-height:240px}.welcome:after{font-size:60px}.unit{grid-template-columns:70px 1fr;padding:15px;border-radius:22px;gap:13px}.visual{height:70px;border-radius:18px;font-size:32px}.unit h3{font-size:20px}.go{width:100%;margin:4px 0 0;text-align:center}.sectionHead{align-items:start;flex-direction:column;gap:4px}}</style></head><body><main class="shell"><nav class="nav"><div class="brand"><div class="logo">⚗</div><span>科学探索站</span></div><div class="pill" id="topStatus">三年级 · 10 个单元</div></nav><section class="hero"><div class="welcome"><div class="ey">SCIENCE EXPLORER · 三年级</div><h1>今天，要探索什么？</h1><p>从生字开始，看图理解科学概念，学会题目的问法，最后完成挑战。每完成一个单元，你的科学地图就会继续亮起来。</p></div><aside class="mission"><div><small>我的科学旅程</small><div><strong id="percent">0%</strong></div><p id="overallText">正在读取学习进度</p></div><div class="track"><span id="overallBar"></span></div></aside></section><div class="sectionHead"><div><h2>探索地图</h2><span>选择一个单元继续学习</span></div><span>词汇 → 图解 → 答题 → 挑战</span></div><section class="grid" id="grid"></section><div class="legend"><strong>学习路线：</strong> ① 认识词汇　② 看图理解　③ 学会答题　④ 挑战测试。学习记录保存在当前浏览器，更换装置或清除浏览器资料后不会自动同步。</div></main><script>const units=[['科学技能','观察、分类、测量、推断、预测与沟通。','⌕'],['科学室规则','安全规则、正确行为与情境判断。','⚗'],['人类','牙齿、食物、均衡饮食与消化。','☺'],['动物','进食习性与动物牙齿。','♞'],['植物','植物繁殖方式与重要性。','♧'],['测量','面积、体积、估算与水置换法。','▦'],['密度','浮起、下沉及增加水的密度。','◒'],['酸与碱','酸性、碱性、中性与指示剂。','⌁'],['太阳系','成员、行星顺序、轨道与公转。','◎'],['机械','滑轮、定滑轮与生活应用。','⚙']];function href(u,p){return u<=3?`unit0${u}-page${p}.html`:`unit.html?u=${u}&p=${p}`}function json(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}function p1(u){if(u===1)return Object.values(json('std3-sci-unit01-page1-v3')).some(Boolean);if(u===2)return Object.values(json('std3-sci-unit02-page1-v2')).some(Boolean);if(u===3)return Object.values(json('std3-sci-unit03-page1-v2')).some(Boolean);return Object.values(json(`std3-u${u}-p1`)).some(Boolean)}function p4(u){if(u===1)return !!json('std3-sci-unit01-page4-v2').completed;if(u===2)return !!json('std3-sci-unit02-page4-v2').completed;if(u===3)return !!json('std3-sci-unit03-page4-v2').completed;const r=localStorage.getItem(`std3-u${u}-p4`);if(r==='complete')return true;try{return !!JSON.parse(r||'{}').completed}catch(e){return false}}function status(u){if(p4(u))return{label:'挑战完成',done:true,stage:4};if(p1(u))return{label:'继续探索',done:false,stage:1};return{label:'尚未开始',done:false,stage:0}}function render(){let complete=0;grid.innerHTML=units.map((x,i)=>{const u=i+1,s=status(u);if(s.done)complete++;const next=s.done?4:(s.stage?2:1);return `<article class="unit u${u}"><div class="visual">${x[2]}</div><div><div class="meta">UNIT ${String(u).padStart(2,'0')}</div><h3>${x[0]}</h3><p>${x[1]}</p><span class="state ${s.done?'complete':''}">${s.label}</span><div class="route">${[1,2,3,4].map(n=>`<a class="step ${s.done||n<=s.stage?'done':''}" href="${href(u,n)}" title="${['认识词汇','看图理解','学会答题','挑战测试'][n-1]}">${n}</a>`).join('')}<a class="go" href="${href(u,next)}">${s.done?'再挑战':'开始学习'} →</a></div></div></article>`}).join('');const pc=complete*10;overallBar.style.width=pc+'%';percent.textContent=pc+'%';overallText.textContent=`已完成 ${complete} / 10 个单元`;topStatus.textContent=`三年级 · 已完成 ${complete}/10`}render();window.addEventListener('pageshow',render);</script></body></html>
