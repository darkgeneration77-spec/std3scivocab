<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>三年级科学核心词汇</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#eef6ff,#fff);color:#1e2a3a}.w{width:min(1120px,92vw);margin:auto;padding:38px 0 70px}.hero,.card{background:#fff;border:1px solid #e5edf6;box-shadow:0 12px 32px #3d5b7d14;border-radius:24px}.hero{padding:32px;margin-bottom:26px}.ey{color:#4f7fb5;font-weight:900;font-size:14px}.hero h1{font-size:clamp(32px,5vw,52px);margin:8px 0}.hero p{color:#65758a;line-height:1.7}.bar{height:11px;background:#e7eef7;border-radius:99px;overflow:hidden;margin-top:18px}.bar span{display:block;width:0;height:100%;background:#5b8fd6;transition:.25s}.summary{margin-top:10px;font-size:13px;font-weight:800;color:#5f7085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{padding:21px;position:relative}.num{font-size:12px;font-weight:900;color:#7c9fc6}.card h2{margin:8px 0;font-size:23px}.card p{color:#6f7f91;margin:0;line-height:1.6}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.tag{padding:7px 10px;border-radius:99px;background:#edf4fb;color:#456b96;text-decoration:none;font-size:12px;font-weight:850}.tag.done{background:#e8f6ee;color:#347a53}.progress{position:absolute;right:18px;top:17px;background:#f2f4f7;color:#667085;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900}.progress.complete{background:#e8f6ee;color:#347a53}.note{margin:22px 4px;color:#718096;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:23px}}</style></head><body><main class="w"><section class="hero"><div class="ey">三年级科学 · 核心词汇学习站</div><h1>Unit 1–10 学习站</h1><p>十个单元均已开放四页。核心词汇、图解理解、题目关键词与快速复习已经建立，学习进度会保存在当前浏览器。</p><div class="bar"><span id="overallBar"></span></div><div class="summary" id="overallText">读取学习进度中...</div></section><section class="grid" id="grid"></section><div class="note">学习记录保存在当前浏览器。更换装置或清除浏览器资料后，进度不会自动同步。</div></main><script>const units=[['科学技能','观察、分类、测量、推断、预测与沟通。'],['科学室规则','安全规则、正确行为与情境判断。'],['人类','牙齿、食物、均衡饮食与消化。'],['动物','摄食习性与动物牙齿。'],['植物','植物繁殖方式与重要性。'],['测量','面积、体积、估算与水置换法。'],['密度','浮起、下沉及增加水的密度。'],['酸与碱','酸性、碱性、中性与石蕊试纸。'],['太阳系','成员、行星顺序、轨道与公转。'],['机械','滑轮、定滑轮与生活应用。']];function pageHref(u,p){return u<=3?`unit0${u}-page${p}.html`:`unit.html?u=${u}&p=${p}`}function readJSON(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return{}}}function hasP1(u){if(u===1)return Object.values(readJSON('std3-sci-unit01-page1-v3')).some(Boolean);if(u===2)return Object.values(readJSON('std3-sci-unit02-page1-v2')).some(Boolean);if(u===3)return Object.values(readJSON('std3-sci-unit03-page1-v2')).some(Boolean);return Object.values(readJSON(`std3-u${u}-p1`)).some(Boolean)}function hasP4(u){if(u===1)return !!readJSON('std3-sci-unit01-page4-v2').completed;if(u===2)return !!readJSON('std3-sci-unit02-page4-v2').completed;if(u===3)return !!readJSON('std3-sci-unit03-page4-v2').completed;const raw=localStorage.getItem(`std3-u${u}-p4`);if(raw==='complete')return true;try{return !!JSON.parse(raw||'{}').completed}catch(e){return false}}function status(u){if(hasP4(u))return{text:'4 / 4',complete:true};if(hasP1(u))return{text:'学习中',complete:false};return{text:'未开始',complete:false}}function render(){let completeCount=0;document.getElementById('grid').innerHTML=units.map((x,i)=>{const u=i+1,s=status(u);if(s.complete)completeCount++;return `<div class="card"><div class="progress ${s.complete?'complete':''}">${s.text}</div><div class="num">UNIT ${String(u).padStart(2,'0')}</div><h2>${x[0]}</h2><p>${x[1]}</p><div class="tags">${[1,2,3,4].map(p=>`<a class="tag ${p===4&&s.complete?'done':''}" href="${pageHref(u,p)}">Page ${p}</a>`).join('')}</div></div>`}).join('');document.getElementById('overallBar').style.width=`${completeCount*10}%`;document.getElementById('overallText').textContent=`已完成 ${completeCount} / 10 个单元`}render();window.addEventListener('pageshow',render);</script></body></html>
